<!DOCTYPE html>
<html>
<head>
    <title>SMS Spam Detection</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 550px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px #0002;
            text-align: center;
        }

        h1 {
            color: #193b67;
        }

        p {
            color: #667085;
        }

        textarea {
            width: 100%;
            height: 130px;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #b8c4d3;
            border-radius: 8px;
            font-size: 16px;
            resize: vertical;
            margin: 15px 0;
        }

        button {
            background: #1677e8;
            color: white;
            border: none;
            padding: 13px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }

        button:hover {
            background: #105db8;
        }

        .result {
            margin-top: 22px;
            padding: 15px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
        }

        .spam {
            background: #fee2e2;
            color: #b91c1c;
        }

        .normal {
            background: #dcfce7;
            color: #15803d;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📱 SMS Spam Detection</h1>
        <p>Enter a message to check whether it is spam or normal.</p>

        <form method="POST">
            <textarea name="message"
                placeholder="Type your SMS here..."
                required></textarea>

            <button type="submit">Check SMS</button>
        </form>

        {% if result %}
            <div class="result {% if result == 'SPAM SMS' %}spam{% else %}normal{% endif %}">
                {% if result == 'SPAM SMS' %}
                    🚨 SPAM SMS
                {% else %}
                    ✅ NORMAL SMS
                {% endif %}
            </div>
        {% endif %}
    </div>
</body>
</html>
