<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SMS Spam Detection</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <div class="logo">📱</div>

        <h1>SMS Spam Detection</h1>

        <p class="subtitle">
            Protect yourself from unwanted and suspicious messages.
        </p>

        <form method="POST">

            <textarea
                name="message"
                placeholder="Type or paste your SMS message here..."
                required></textarea>

            <button type="submit">
                🔍 Check SMS
            </button>

        </form>

        {% if prediction %}
        <div class="result">
            {{ prediction }}
        </div>
        {% endif %}

        <div class="info">
            🤖 Powered by Machine Learning &nbsp; | &nbsp;
            TF-IDF Text Classification
        </div>

        <div class="footer">
            SMS Spam Detection Project
        </div>

    </div>

</body>

</html>
